<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Skin AI Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="bg"></div>

    <div class="card">
        <h1>AI Skin Disease Detector</h1>
        <p class="subtitle">Upload an image and let AI analyze it</p>

        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            <label class="drop-zone" id="dropZone">
                <input type="file" name="image" id="fileInput" required hidden>
                <span id="dropText">Drag & Drop or Click to Upload</span>
            </label>

            <button type="submit" id="analyzeBtn">Analyze Image</button>
        </form>


        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>

        <!-- Preview -->
        {% if image_path %}
        <div class="preview">
            <h3>Preview</h3>
            <img src="{{ image_path }}">
        </div>
        {% endif %}

        <!-- Result -->
        {% if prediction %}
        <div class="result">
            <h2>{{ prediction }}</h2>
            <div class="progress-bar">
                <div class="progress" style="width: {{ confidence }} %"></div>
            </div>
            <p>{{ confidence }}% confidence</p>
        </div>
        {% endif %}

    </div>

    <script>
        const form = document.getElementById("uploadForm");
        const loading = document.getElementById("loading");

        form.addEventListener("submit", () => {
            loading.classList.remove("hidden");
        });

        // Drag & Drop UI
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const dropText = document.getElementById("dropText");

        dropZone.addEventListener("click", () => fileInput.click());

        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            fileInput.files = e.dataTransfer.files;
            dropText.innerText = e.dataTransfer.files[0].name;
        });
    </script>

</body>

</html>
